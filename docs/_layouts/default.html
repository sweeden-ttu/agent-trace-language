<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} | {{ site.title }}</title>
  
  <!-- Modern Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  
  <!-- MathJax Configuration & CDN -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true
      },
      options: {
        skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
      }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

  <!-- Premium Vanilla CSS Styling -->
  <style>
    :root {
      --bg-color: #0d0f17;
      --card-bg: rgba(22, 28, 45, 0.65);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --primary: #8b5cf6;
      --primary-glow: rgba(139, 92, 246, 0.45);
      --secondary: #3b82f6;
      --accent: #10b981;
      --font-heading: 'Outfit', sans-serif;
      --font-body: 'Inter', sans-serif;
      --font-mono: 'Fira Code', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      background-image: 
        radial-gradient(at 10% 20%, rgba(59, 130, 246, 0.08) 0px, transparent 50%),
        radial-gradient(at 90% 80%, rgba(139, 92, 246, 0.08) 0px, transparent 50%);
      background-attachment: fixed;
      color: var(--text-main);
      font-family: var(--font-body);
      line-height: 1.625;
      -webkit-font-smoothing: antialiased;
      padding-bottom: 60px;
    }

    /* Header & Navbar */
    header {
      background: rgba(13, 15, 23, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--card-border);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 15px 0;
    }

    .nav-container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .site-title {
      font-family: var(--font-heading);
      font-size: 1.35rem;
      font-weight: 700;
      color: #fff;
      text-decoration: none;
      background: linear-gradient(135deg, #fff 30%, var(--primary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .nav-links {
      display: flex;
      gap: 24px;
      list-style: none;
    }

    .nav-links a {
      color: var(--text-muted);
      text-decoration: none;
      font-weight: 500;
      font-size: 0.95rem;
      transition: color 0.25s ease, text-shadow 0.25s ease;
    }

    .nav-links a:hover, .nav-links a.active {
      color: #fff;
      text-shadow: 0 0 10px var(--primary-glow);
    }

    /* Container Main */
    main {
      max-width: 1100px;
      margin: 40px auto 0 auto;
      padding: 0 24px;
    }

    /* Typography */
    h1, h2, h3, h4 {
      font-family: var(--font-heading);
      color: #fff;
      font-weight: 700;
      margin-bottom: 1rem;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 1.5rem;
      background: linear-gradient(135deg, #ffffff 40%, #a78bfa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.2;
    }

    h2 {
      font-size: 1.75rem;
      margin-top: 2rem;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 8px;
    }

    h3 {
      font-size: 1.35rem;
      margin-top: 1.5rem;
    }

    p {
      margin-bottom: 1.25rem;
      color: var(--text-muted);
    }

    strong {
      color: #fff;
    }

    /* Code Blocks */
    pre, code {
      font-family: var(--font-mono);
      font-size: 0.9rem;
    }

    code {
      background: rgba(255, 255, 255, 0.06);
      padding: 2px 6px;
      border-radius: 4px;
      color: #f472b6;
    }

    pre {
      background: #080a0f;
      border: 1px solid var(--card-border);
      padding: 18px;
      border-radius: 10px;
      overflow-x: auto;
      margin-bottom: 1.5rem;
    }

    pre code {
      background: transparent;
      padding: 0;
      color: #e5e7eb;
    }

    /* Tables */
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 1.5rem 0;
      font-size: 0.95rem;
    }

    th, td {
      padding: 12px 16px;
      text-align: left;
      border-bottom: 1px solid var(--card-border);
    }

    th {
      background: rgba(255, 255, 255, 0.04);
      color: #fff;
      font-weight: 600;
    }

    tr:hover {
      background: rgba(255, 255, 255, 0.02);
    }

    /* Math Blocks Styling */
    .mjx-chtml {
      font-size: 1.05rem !important;
      color: #fff !important;
    }

    /* Custom Cards / Containers */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 1.5rem;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .card:hover {
      border-color: rgba(139, 92, 246, 0.3);
      box-shadow: 0 12px 40px 0 rgba(139, 92, 246, 0.1);
    }

    /* Alert / Callouts */
    .alert {
      padding: 16px;
      border-left: 4px solid var(--primary);
      background: rgba(139, 92, 246, 0.05);
      border-radius: 0 8px 8px 0;
      margin: 1.5rem 0;
    }
    .alert-title {
      font-weight: 600;
      color: #fff;
      margin-bottom: 4px;
      font-size: 0.95rem;
    }

    /* Links */
    a {
      color: var(--primary);
      text-decoration: none;
      transition: color 0.2s ease, text-decoration 0.2s ease;
    }

    a:hover {
      color: #a78bfa;
      text-decoration: underline;
    }

    .btn {
      display: inline-block;
      background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
      color: #fff;
      padding: 10px 20px;
      border-radius: 6px;
      font-weight: 600;
      text-decoration: none !important;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 4px 14px 0 var(--primary-glow);
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px 0 var(--primary-glow);
    }
  </style>
</head>
<body>

  <header>
    <div class="nav-container">
      <a href="index.html" class="site-title">Trace Theory Docs</a>
      <nav>
        <ul class="nav-links">
          <li><a href="index.html">Introduction</a></li>
          <li><a href="experiments.html">Experiments</a></li>
          <li><a href="how_they_were_run.html">Running Details</a></li>
          <li><a href="paper_tie_in.html">Paper Connection</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <div class="card">
      {{ content }}
    </div>
  </main>

  <script>
    // Simple Active Link Script
    const currentUrl = window.location.pathname.split('/').pop() || 'index.html';
    document.querySelectorAll('.nav-links a').forEach(a => {
      const linkUrl = a.getAttribute('href');
      if (linkUrl === currentUrl) {
        a.classList.add('active');
      }
    });
  </script>

</body>
</html>
